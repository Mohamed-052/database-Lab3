<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add New Book - Library Portal</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --input-bg: #ffffff;
        }

        [data-theme="dark"] {
            --primary: #6366f1;
            --primary-hover: #818cf8;
            --bg-main: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --input-bg: #0f172a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 40px;
            transition: background-color 0.3s, color 0.3s;
        }
        .container {
            max-width: 600px;
            margin: auto;
        }
        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }
        .btn-theme {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-theme:hover {
            background: var(--border);
        }
        .form-card {
            background: var(--card-bg);
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
        }
        h2 {
            margin-top: 0;
            color: var(--primary);
            font-size: 22px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 8px;
            color: var(--text-main);
        }
        input[type="text"],
        input[type="number"],
        input[type="file"] {
            width: 100%;
            padding: 12px 14px;
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: var(--primary);
        }
        input[type="file"] {
            padding: 10px;
            cursor: pointer;
        }
        .btn-submit {
            background: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background: var(--primary-hover);
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }
        .back-link:hover {
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <button class="btn-theme" onclick="toggleTheme()" id="themeBtn">🌙 Dark Mode</button>
        </div>

        <div class="form-card">
            <h2>📚 Add New Book & Author</h2>
            <form action="{{ url_for('add_book') }}" method="POST" enctype="multipart/form-data">
                
                <div class="form-group">
                    <label>Book ID:</label>
                    <input type="number" name="book_id" required placeholder="e.g. 401">
                </div>

                <div class="form-group">
                    <label>Title:</label>
                    <input type="text" name="title" required placeholder="e.g. The Hobbit">
                </div>

                <div class="form-group">
                    <label>Price ($):</label>
                    <input type="number" step="0.01" name="price" required placeholder="e.g. 19.99">
                </div>

                <div class="form-group">
                    <label>Author ID:</label>
                    <input type="number" name="author_id" required placeholder="e.g. 4">
                </div>

                <div class="form-group">
                    <label>Author Name:</label>
                    <input type="text" name="author_name" required placeholder="e.g. J.R.R. Tolkien">
                </div>

                <div class="form-group">
                    <label>Country:</label>
                    <input type="text" name="country" required placeholder="e.g. UK">
                </div>

                <div class="form-group">
                    <label>Cover Image:</label>
                    <input type="file" name="cover_image" accept="image/*">
                </div>

                <div class="form-group">
                    <label>Author Photo:</label>
                    <input type="file" name="author_photo" accept="image/*">
                </div>

                <button type="submit" class="btn-submit">Save Book</button>
            </form>

            <a href="{{ url_for('index') }}" class="back-link">&larr; Back to Library</a>
        </div>
    </div>

    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const btn = document.getElementById('themeBtn');
            if (html.getAttribute('data-theme') === 'dark') {
                html.removeAttribute('data-theme');
                btn.textContent = '🌙 Dark Mode';
                localStorage.setItem('theme', 'light');
            } else {
                html.setAttribute('data-theme', 'dark');
                btn.textContent = '☀️ Light Mode';
                localStorage.setItem('theme', 'dark');
            }
        }

        // Synchronize theme choice across pages automatically
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.getElementById('themeBtn').textContent = '☀️ Light Mode';
        }
    </script>
</body>
</html>
